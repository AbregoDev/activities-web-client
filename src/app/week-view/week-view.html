<section class="week-view" aria-label="Week calendar">
  <header class="week-toolbar">
    <div class="week-heading">
      <h1>Week</h1>
      <nav class="week-navigation" aria-label="Week navigation">
        <button type="button" aria-label="Previous week" (click)="moveWeek(-1)">Previous</button>
        <p class="week-range" aria-live="polite" aria-atomic="true">{{ weekLabel() }}</p>
        <button type="button" aria-label="Next week" (click)="moveWeek(1)">Next</button>
        <button type="button" (click)="goToCurrentWeek()">Current week</button>
      </nav>
    </div>
    <div class="week-options">
      <div class="start-option">
        <span id="week-start-label">Week starts on</span>
        <p-selectbutton
          [options]="startOptions"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          [ngModel]="weekStartsOn()"
          (ngModelChange)="weekStartsOn.set($event)"
          ariaLabelledBy="week-start-label"
        />
      </div>
      <label class="weekend-option">
        <p-toggleswitch
          [ngModel]="showWeekends()"
          (ngModelChange)="showWeekends.set($event)"
          ariaLabel="Show weekends"
        />
        <span>Show weekends</span>
      </label>
    </div>
  </header>

  <div class="calendar-scroll" tabindex="0" role="region" aria-label="Hourly week calendar">
    <table aria-label="Weekly schedule">
      <colgroup>
        <col class="time-column" />
        @for (day of visibleDays(); track day.dateKey) {
          <col />
        }
      </colgroup>
      <thead>
        <tr>
          <th class="time-heading" scope="col">Time</th>
          @for (day of visibleDays(); track day.dateKey) {
            <th
              scope="col"
              [class.weekend]="day.weekend"
              [class.today]="day.isToday"
              [attr.aria-current]="day.isToday ? 'date' : null"
            >
              <span>{{ day.name }}</span>
              <time [attr.datetime]="day.dateKey">{{ day.dateLabel }}</time>
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (hour of hours; track hour) {
          <tr>
            <th scope="row">{{ hour }}</th>
            @for (day of visibleDays(); track day.dateKey) {
              <td [class.weekend]="day.weekend" [class.today]="day.isToday"></td>
            }
          </tr>
        }
      </tbody>
    </table>
  </div>
</section>
