<div class="completion-checkbox" (click)="$event.stopPropagation()">
  <p-checkbox
    [inputId]="'activity-' + activity().id"
    [binary]="true"
    [ngModel]="activity().isCompleted"
    (ngModelChange)="completedChange.emit($event)"
    [ariaLabel]="'Mark ' + activity().name + ' as complete'"
  />
</div>
<button type="button" class="activity-name" [title]="activity().name">
  {{ activity().name }}
</button>
